name: 📦 Build & Push Multi-Arch Docker Image

on:
  release:
    types: [published]

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.image-tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: set-tag
        run: echo "::set-output name=image-tag::${GITHUB_REF_NAME}-amd64"

      - name: Build and push amd64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/iris:${{ steps.set-tag.outputs.image-tag }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/iris:cache-amd64
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/iris:cache-amd64,mode=max

  build-arm64:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.image-tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: set-tag
        run: echo "::set-output name=image-tag::${GITHUB_REF_NAME}-arm64"

      - name: Build and push arm64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/iris:${{ steps.set-tag.outputs.image-tag }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/iris:cache-arm
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/iris:cache-arm,mode=max

  notify-infra:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    steps:
      - name: Trigger Infra repo to update tag
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_TRIGGER_TOKEN }}
          repository: Sleeved-Project/infra
          event-type: update-iris-tag
          client-payload: '{"version": "${{ github.ref_name }}"}'

      - name: Add version to job summary
        if: success()
        run: |
          echo "## ✅ Built images versions: AMD64: ${{ needs.build-amd64.outputs.image-tag }}, ARM64: ${{ needs.build-arm64.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
