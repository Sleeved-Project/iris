name: 📦 Build & Push Multi-Arch Docker Image

on:
  release:
    types: [published]

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/iris:${{ github.ref_name }}-amd64
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/iris:cache-amd64
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/iris:cache-amd64,mode=max

  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/iris:${{ github.ref_name }}-arm64
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/iris:cache-arm64
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/iris:cache-arm64,mode=max

  create-manifest:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker manifest create \
            ${{ secrets.DOCKERHUB_USERNAME }}/iris:${{ github.ref_name }} \
            --amend ${{ secrets.DOCKERHUB_USERNAME }}/iris:${{ github.ref_name }}-amd64 \
            --amend ${{ secrets.DOCKERHUB_USERNAME }}/iris:${{ github.ref_name }}-arm64

          docker manifest push ${{ secrets.DOCKERHUB_USERNAME }}/iris:${{ github.ref_name }}

          docker manifest create \
            ${{ secrets.DOCKERHUB_USERNAME }}/iris:latest \
            --amend ${{ secrets.DOCKERHUB_USERNAME }}/iris:${{ github.ref_name }}-amd64 \
            --amend ${{ secrets.DOCKERHUB_USERNAME }}/iris:${{ github.ref_name }}-arm64

          docker manifest push ${{ secrets.DOCKERHUB_USERNAME }}/iris:latest

  trigger-infra:
    runs-on: ubuntu-latest
    needs: [create-manifest]
    steps:
      - name: Trigger Infra repo to update tag
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_TRIGGER_TOKEN }}
          repository: Sleeved-Project/infra
          event-type: update-iris-tag
          client-payload: '{"version": "${{ github.ref_name }}"}'

      - name: Add version to job summary
        if: success()
        run: |
          echo "## ✅ Built multi-arch image version: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
